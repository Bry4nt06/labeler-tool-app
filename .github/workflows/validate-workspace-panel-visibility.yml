name: Validate workspace panel visibility

on:
  push:
    branches: [main]
    paths:
      - app.js
      - app/workspace-panel-visibility-guard-integration.js
      - tests/default-hidden-workspace-panels.test.js
      - tests/workspace-panel-visibility-guard.test.js
      - .github/workflows/validate-workspace-panel-visibility.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check app.js
          node --check app/workspace-panel-visibility-guard-integration.js
          node --check tests/workspace-panel-visibility-guard.test.js
      - name: Run workspace visibility regressions
        run: |
          node tests/default-hidden-workspace-panels.test.js
          node tests/workspace-panel-visibility-guard.test.js
