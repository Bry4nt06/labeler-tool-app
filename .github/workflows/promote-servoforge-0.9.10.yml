name: Promote ServoForge 0.9.10

on:
  push:
    branches:
      - release/servoforge-0.9.10-2026-08-03
    paths:
      - .github/workflows/promote-servoforge-0.9.10.yml

permissions:
  contents: write

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-0.9.10]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out production release branch
        uses: actions/checkout@v4
        with:
          path: production
          fetch-depth: 0
          persist-credentials: true

      - name: Check out approved staging hotfix
        uses: actions/checkout@v4
        with:
          repository: Bry4nt06/labeler-tool-staging
          ref: 4e5bb1a61bfd5680692690b7b7a2f30b5ae204f2
          path: staging
          fetch-depth: 1

      - name: Run focused regressions
        shell: bash
        run: |
          node staging/tests/brand-selection-regeneration.test.js
          node staging/tests/validation-diagnostics-summary-fit.test.js
          node staging/tests/map-double-click-coder-segment-grammar.test.js

      - name: Copy approved runtime hotfix files
        shell: bash
        run: |
          cp staging/app/controllers/build-inputs-controller.js production/app/controllers/build-inputs-controller.js
          cp staging/app/validation-diagnostics-integration.js production/app/validation-diagnostics-integration.js
          cp staging/app/simulation-collapsible-integration.js production/app/simulation-collapsible-integration.js

      - name: Normalize ServoForge 0.9.10 production release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import re

          root = Path('production')
          version = '0.9.10'
          source_sha = '4e5bb1a61bfd5680692690b7b7a2f30b5ae204f2'
          production_url = 'https://bry4nt06.github.io/labeler-tool-app/'

          def update(path, transform):
              p = root / path
              text = p.read_text(encoding='utf-8')
              p.write_text(transform(text), encoding='utf-8')

          update('index.html', lambda text: re.sub(
              r'(<meta name="application-version" content=")[^"]+("\s*/>)',
              rf'\g<1>{version}\2',
              re.sub(r'(\?v=)[^"\']+', rf'\g<1>{version}', re.sub(r'Version\s+\d+\.\d+\.\d+\s+•', f'Version {version} •', text))
          ))

          def bootstrap(text):
              text = re.sub(r'const version = "[^"]+";', f'const version = "{version}";', text, count=1)
              return re.sub(
                  r'  const banner = document\.querySelector\("\.staging-environment-banner"\);\n  if \(banner\) banner\.textContent = `STAGING \$\{version\} / TEST BUILD — NOT PRODUCTION`;\n',
                  '  document.querySelector(".staging-environment-banner")?.remove();\n',
                  text,
                  count=1
              )
          update('app/bootstrap.js', bootstrap)

          def release_constant(text):
              text = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', text)
              text = re.sub(r'const VALIDATOR_RELEASE_VERSION = "[^"]+";', f'const VALIDATOR_RELEASE_VERSION = "{version}";', text)
              return text
          update('app/update-manager.js', release_constant)
          update('app/servo-pipeline-validator-integration.js', release_constant)

          def service_worker(text):
              text = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', text, count=1)
              text = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-production-v{version}-{source_sha[:7]}";', text, count=1)
              text = re.sub(r'const CACHE_PREFIX = "[^"]+";', 'const CACHE_PREFIX = "servoforge-labeler-production-";', text, count=1)
              return text
          update('service-worker.js', service_worker)

          manifest_path = root / 'update-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update({
              'schemaVersion': 1,
              'version': version,
              'releaseUrl': production_url,
              'downloadUrl': production_url,
              'notes': 'ServoForge 0.9.10 regenerates the Servo Program when a Brand Recipe is selected and stacks the top Validation summary so it cannot overflow the panel.'
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          notes_path = root / 'release-notes.json'
          notes = json.loads(notes_path.read_text(encoding='utf-8'))
          notes['environment'] = 'production'
          notes['currentVersion'] = version
          notes['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          release = {
              'version': version,
              'milestone': 13,
              'title': 'Brand Regeneration and Validation Fit Hotfix',
              'summary': 'Ensures two-label Brand Recipes regenerate immediately and keeps the top Validation status card within the panel width.',
              'changes': [
                  'Apply dimension-driven label station rules whenever a Brand Recipe is selected.',
                  'Regenerate and persist the Servo Program before rerendering Validation.',
                  'Stack Validation status, faults, warnings, checks, and duplicate counts in one constrained column.',
                  'Refresh production release and cache identifiers to prevent reuse of the 0.9.9 behavior.'
              ]
          }
          notes['releases'] = [release, *[item for item in notes.get('releases', []) if item.get('version') != version]]
          notes_path.write_text(json.dumps(notes, indent=2) + '\n', encoding='utf-8')

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.js', '.json', '.html', '.webmanifest', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('https://bry4nt06.github.io/labeler-tool-staging/', production_url)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit production hotfix
        shell: bash
        run: |
          cd production
          rm -f .github/workflows/promote-servoforge-0.9.10.yml
          git config user.name "ServoForge Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Promote approved staging 4e5bb1a as ServoForge 0.9.10"
          git push origin HEAD:release/servoforge-0.9.10-2026-08-03
