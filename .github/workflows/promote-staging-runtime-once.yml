name: Promote staging runtime once

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: promote-staging-runtime-once
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch current staging
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Bry4nt06/labeler-tool-staging.git /tmp/labeler-tool-staging
          test "$(git -C /tmp/labeler-tool-staging rev-parse HEAD)" = "5b75cad798ce61f79142705b3232c0f31eb319db"

      - name: Mirror staging runtime into production
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='index.html' \
            --exclude='update-manifest.json' \
            --exclude='release-notes.json' \
            --exclude='service-worker.js' \
            /tmp/labeler-tool-staging/ ./

          cp /tmp/labeler-tool-staging/service-worker.js ./service-worker.js

          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')

          worker_path = root / 'service-worker.js'
          worker = worker_path.read_text(encoding='utf-8')
          worker = re.sub(
              r'const CACHE_NAME = "[^"]+";',
              'const CACHE_NAME = "servoforge-labeler-v0.9.10-production-label-centerline-policy-v31";',
              worker,
              count=1,
          )
          worker = re.sub(
              r'const CACHE_PREFIX = "[^"]+";',
              'const CACHE_PREFIX = "servoforge-labeler-";',
              worker,
              count=1,
          )
          worker_path.write_text(worker, encoding='utf-8')

          manifest_path = root / 'update-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.9.10'
          manifest['buildId'] = 'label-centerline-policy-v31'
          manifest['releaseUrl'] = 'https://bry4nt06.github.io/labeler-tool-app/'
          manifest['downloadUrl'] = 'https://bry4nt06.github.io/labeler-tool-app/'
          manifest['notes'] = (
              'Production runtime promoted from staging 5b75cad798ce61f79142705b3232c0f31eb319db. '
              'Includes editable Map Builder behavior, physical sensor line-of-sight visibility, '
              'live sensor updates, and the universal label centerline policy.'
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          notes_path = root / 'release-notes.json'
          notes = json.loads(notes_path.read_text(encoding='utf-8'))
          notes['environment'] = 'production'
          notes['currentVersion'] = '0.9.10'
          notes_path.write_text(json.dumps(notes, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/promote-staging-runtime-once.yml

      - name: Verify promoted runtime before commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'label-centerline-policy-v31' app.js
          grep -q 'label-centerline-policy-20260807-0001' app/bootstrap.js
          grep -q 'LabelerLabelCenterlinePolicy' app/label-centerline-policy-integration.js
          grep -q 'sensorDirectionLiveStatusV2' app/sensor-direction-live-status-integration.js
          grep -q 'servoforge-labeler-v0.9.10-production-label-centerline-policy-v31' service-worker.js
          grep -q 'bry4nt06.github.io/labeler-tool-app/' update-manifest.json
          ! grep -q 'labeler-tool-staging' update-manifest.json
          ! grep -q 'STAGING / TEST BUILD' index.html

          node --check app.js
          node --check service-worker.js
          node --check app/label-centerline-policy-integration.js
          node --check app/label-sensor-geometry-service.js
          node --check app/orientation-constraint-target-service.js
          node --check app/orientation-constraint-planner-integration.js
          node --check app/sensor-direction-live-status-integration.js
          node --check app/sensor-editor-compact-interaction-integration.js

          node tests/label-centerline-policy.test.js
          node tests/sensor-physical-visibility-model.test.js
          node tests/sensor-direction-live-status.test.js
          node tests/sensor-live-visibility-alignment.test.js
          node tests/landshark-first-application-zero-datum.test.js
          node tests/sensor-aim-geometry.test.js

      - name: Commit full staging runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production already matches the staging runtime."
            exit 0
          fi
          git commit -m "Promote full staging runtime 5b75cad"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
