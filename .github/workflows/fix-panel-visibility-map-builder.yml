name: Fix panel visibility and map builder

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-panel-visibility-map-builder.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('app/workspace-developer-integration.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '.workspace-panel-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px}',
              '.workspace-panel-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px}'
          )
          text = text.replace(
              '.workspace-panel-toggle{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input);font-size:10px;line-height:1.25}',
              '.workspace-panel-toggle{display:grid!important;grid-template-columns:18px minmax(0,1fr)!important;align-items:center;gap:8px;min-width:0;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--input);font-size:10px;line-height:1.25;overflow:hidden}.workspace-panel-toggle input{width:16px!important;height:16px!important;min-width:16px!important;margin:0!important;padding:0!important;justify-self:start}.workspace-panel-toggle span{min-width:0;overflow-wrap:anywhere}'
          )
          text = text.replace(
              'return `<label class="workspace-panel-toggle"><input type="checkbox" data-developer-panel="${id}"${checked}> Hide ${label}</label>`;',
              'return `<label class="workspace-panel-toggle"><input type="checkbox" data-developer-panel="${id}"${checked}><span>Hide ${label}</span></label>`;'
          )
          text = text.replace(
              'const shouldHide = hidden.has(id) || (id === "mapBuilder" && mapIsLocked());',
              'const shouldHide = hidden.has(id);'
          )
          text = text.replace(
              'if (id === "mapBuilder" && shouldHide) closeBuilder();',
              'if (id === "mapBuilder" && (shouldHide || mapIsLocked())) closeBuilder();'
          )

          marker = '  function syncTabState() {'
          helper = '''  function syncMapBuilderAvailability() {
    const builder = document.querySelector("#wipeDownBuilderButton");
    if (!builder) return;
    const locked = mapIsLocked();
    builder.disabled = locked;
    builder.setAttribute("aria-disabled", String(locked));
    builder.title = locked ? "Unlock the selected map in Settings to edit it." : "Open Map Builder";
    builder.textContent = locked ? "Map Builder — Locked" : "Map Builder";
    builder.dataset.lockedMap = String(locked);
  }

'''
          if helper not in text:
              text = text.replace(marker, helper + marker)
          text = text.replace(
              '    bindDynamicControls();\n    syncTabState();',
              '    bindDynamicControls();\n    syncMapBuilderAvailability();\n    syncTabState();'
          )

          path.write_text(text, encoding='utf-8')

          style_path = Path('styles.css')
          css = style_path.read_text(encoding='utf-8')
          css += '''\n\n/* Workspace control sizing hotfix */\n.workspace-panel-visibility{overflow:hidden}\n.workspace-panel-visibility>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}\n.workspace-panel-toggles{width:100%;min-width:0}\n.workspace-panel-toggle{width:100%;max-width:100%}\n.workspace-panel-toggle input[type="checkbox"]{appearance:auto!important;transform:none!important}\n#wipeDownBuilderButton[data-locked-map="true"]{display:inline-flex!important;opacity:.62;cursor:not-allowed;border-color:#d79a3c;color:#ffc56b;background:var(--panel)}\n.tabs{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}\n.tabs>.tab{flex:0 0 auto}\n@media(max-width:800px){.workspace-panel-toggles{grid-template-columns:1fr!important}}\n'''
          style_path.write_text(css, encoding='utf-8')

          for filename in ['index.html','app/update-manager.js','service-worker.js']:
              p = Path(filename)
              p.write_text(p.read_text(encoding='utf-8').replace('0.9.2','0.9.3'), encoding='utf-8')

          manifest_path = Path('update-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.9.3'
          manifest['notes'] = 'STAGING 0.9.3 fixes panel visibility control sizing and keeps Map Builder visible while locked maps are read-only.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/fix-panel-visibility-map-builder.yml').unlink(missing_ok=True)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app/workspace-developer-integration.js
          node --check app/update-manager.js
          node --check service-worker.js
          python -m json.tool update-manifest.json >/dev/null
          grep -q 'Map Builder — Locked' app/workspace-developer-integration.js
          grep -q 'workspace-panel-toggle span' app/workspace-developer-integration.js
          grep -q 'application-version" content="0.9.3' index.html
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "ServoForge Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix panel visibility controls and restore Map Builder tab"
          git push origin HEAD:main
