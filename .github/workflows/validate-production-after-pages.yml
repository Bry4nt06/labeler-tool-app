name: Validate production after Pages

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: promote-complete-staging-after-pages
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch complete staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/Bry4nt06/labeler-tool-staging.git "$RUNNER_TEMP/labeler-tool-staging"
          git -C "$RUNNER_TEMP/labeler-tool-staging" rev-parse HEAD | tee "$RUNNER_TEMP/staging-head.txt"

      - name: Mirror staging into production
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            "$RUNNER_TEMP/labeler-tool-staging/" \
            "$GITHUB_WORKSPACE/"

      - name: Commit and push exact staging tree
        shell: bash
        run: |
          set -euo pipefail
          staging_head="$(cat "$RUNNER_TEMP/staging-head.txt")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production already matches staging ${staging_head}."
            exit 0
          fi
          git commit -m "Promote complete staging snapshot ${staging_head}"
          git push origin HEAD:main
