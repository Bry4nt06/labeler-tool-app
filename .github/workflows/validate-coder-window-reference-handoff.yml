name: Validate coder window handoff

on:
  push:
    branches: [main]
    paths:
      - app.js
      - app/coder-window-reference-handoff-integration.js
      - app/orientation-constraint-program-planner.js
      - app/orientation-constraint-planner-integration.js
      - app/coder-rest-grammar-repair-integration.js
      - app/machine-terminal-policy-integration.js
      - drivers/servo/rest-correction-grammar-driver.js
      - tests/coder-window-reference-handoff.test.js
      - .github/workflows/validate-coder-window-reference-handoff.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app/coder-window-reference-handoff-integration.js
          node --check tests/coder-window-reference-handoff.test.js
      - name: Run coder window regression
        run: node tests/coder-window-reference-handoff.test.js
