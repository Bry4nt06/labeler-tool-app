name: Promote staging 82d45da once

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: promote-staging-82d45da-once
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch frozen staging release
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Bry4nt06/labeler-tool-staging.git /tmp/labeler-tool-staging
          test "$(git -C /tmp/labeler-tool-staging rev-parse HEAD)" = "82d45da9cf786ecfbd40c1581ffaefa86b878396"

      - name: Mirror staging runtime and restore production identity
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='update-manifest.json' \
            --exclude='release-notes.json' \
            /tmp/labeler-tool-staging/ ./

          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          staging_sha = '82d45da9cf786ecfbd40c1581ffaefa86b878396'
          version = '0.9.10'
          build_id = 'spender-plate-visual-controls-v35'

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('<title>ServoForge Labeler — STAGING</title>', '<title>ServoForge Labeler</title>')
          index = re.sub(
              r'<div class="staging-environment-banner" role="status">.*?</div>',
              '',
              index,
              count=1,
          )
          index_path.write_text(index, encoding='utf-8')

          worker_path = root / 'service-worker.js'
          worker = worker_path.read_text(encoding='utf-8')
          worker = re.sub(
              r'const CACHE_NAME = "[^"]+";',
              'const CACHE_NAME = "servoforge-labeler-v0.9.10-production-spender-plate-v35-82d45da";',
              worker,
              count=1,
          )
          worker = re.sub(
              r'const CACHE_PREFIX = "[^"]+";',
              'const CACHE_PREFIX = "servoforge-labeler-";',
              worker,
              count=1,
          )
          worker_path.write_text(worker, encoding='utf-8')

          manifest_path = root / 'update-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          manifest['buildId'] = build_id
          manifest['releaseUrl'] = 'https://bry4nt06.github.io/labeler-tool-app/'
          manifest['downloadUrl'] = 'https://bry4nt06.github.io/labeler-tool-app/'
          manifest['notes'] = (
              f'Production runtime promoted from staging {staging_sha}. '
              'Includes all tested staging changes through spender plate visual controls, '
              'the ServoForge brand/theme refresh, Direct view validation, and the latest '
              'label application and sensor behavior.'
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          notes_path = root / 'release-notes.json'
          notes = json.loads(notes_path.read_text(encoding='utf-8'))
          notes['environment'] = 'production'
          notes['currentVersion'] = version
          notes_path.write_text(json.dumps(notes, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/promote-staging-82d45da-once.yml

      - name: Validate promoted production snapshot
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'spender-v35' index.html
          grep -q 'assets/servoforge-mark.svg' manifest.webmanifest
          grep -q 'spender-plate-visual-controls-v35-20260807-1402' app/bootstrap.js
          grep -q 'label-application-reference-v32' app.js
          grep -q 'servoforge-labeler-v0.9.10-production-spender-plate-v35-82d45da' service-worker.js
          grep -q 'bry4nt06.github.io/labeler-tool-app/' update-manifest.json
          ! grep -q 'labeler-tool-staging' update-manifest.json
          ! grep -q 'STAGING / TEST BUILD' index.html
          ! grep -q '<title>ServoForge Labeler — STAGING</title>' index.html

          node --check app.js
          node --check service-worker.js
          node --check app/bootstrap.js
          node --check app/assembly-map-renderer.js
          node --check app/map-builder-controls.js
          node --check app/map-builder-controller.js
          node --check app/controllers/map-builder-layout-controller.js
          node --check app/map-schema-adapter-integration.js
          node --check app/servoforge-brand-theme-integration.js
          node --check app/controllers/theme-presets-controller.js
          node --check drivers/map/map-schema-driver.js
          node --check drivers/map/map-migration-driver.js
          node tests/spender-plate-visual-controls.test.js

      - name: Commit production promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production already matches staging 82d45da."
            exit 0
          fi
          git commit -m "Promote full staging runtime 82d45da"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
