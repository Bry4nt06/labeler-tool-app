name: Promote ServoForge 0.9.9

on:
  push:
    branches:
      - release/servoforge-0.9.9-2026-08-03
    paths:
      - .github/workflows/promote-servoforge-0.9.9.yml

permissions:
  contents: write

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-0.9.9]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out production release branch
        uses: actions/checkout@v4
        with:
          path: production
          fetch-depth: 0
          persist-credentials: true

      - name: Check out approved staging build
        uses: actions/checkout@v4
        with:
          repository: Bry4nt06/labeler-tool-staging
          ref: 200c8d2a1fd19bdb56ad97a644bc7c26d402c9c6
          path: staging
          fetch-depth: 1

      - name: Synchronize runtime application
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            staging/ production/

      - name: Normalize ServoForge 0.9.9 production release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import re

          root = Path('production')
          version = '0.9.9'
          source_sha = '200c8d2a1fd19bdb56ad97a644bc7c26d402c9c6'
          production_url = 'https://bry4nt06.github.io/labeler-tool-app/'

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          index = read('index.html')
          index = re.sub(r'(<meta name="application-version" content=")[^"]+("\s*/>)', rf'\g<1>{version}\2', index)
          index = re.sub(r'(\?v=)[^"\']+', rf'\g<1>{version}', index)
          index = re.sub(r'Version\s+\d+\.\d+\.\d+\s+•', f'Version {version} •', index)
          index = index.replace('<title>ServoForge Labeler — STAGING</title>', '<title>ServoForge Labeler</title>')
          index = re.sub(r'<div class="staging-environment-banner"[^>]*>.*?</div>', '', index, flags=re.S)
          write('index.html', index)

          bootstrap = read('app/bootstrap.js')
          bootstrap = re.sub(r'const version = "[^"]+";', f'const version = "{version}";', bootstrap, count=1)
          bootstrap = re.sub(
              r'  const banner = document\.querySelector\("\.staging-environment-banner"\);\n  if \(banner\) banner\.textContent = `STAGING \$\{version\} / TEST BUILD — NOT PRODUCTION`;\n',
              '  document.querySelector(".staging-environment-banner")?.remove();\n',
              bootstrap,
              count=1
          )
          write('app/bootstrap.js', bootstrap)

          for relative in ['app/update-manager.js', 'app/servo-pipeline-validator-integration.js']:
              path = root / relative
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', text)
              text = re.sub(r'const VALIDATOR_RELEASE_VERSION = "[^"]+";', f'const VALIDATOR_RELEASE_VERSION = "{version}";', text)
              path.write_text(text, encoding='utf-8')

          sw = read('service-worker.js')
          sw = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', sw, count=1)
          sw = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-production-v{version}-{source_sha[:7]}";', sw, count=1)
          sw = re.sub(r'const CACHE_PREFIX = "[^"]+";', 'const CACHE_PREFIX = "servoforge-labeler-production-";', sw, count=1)

          module_match = re.search(r'const modules = Object\.freeze\(\[(.*?)\]\);', bootstrap, flags=re.S)
          controller_assets = []
          if module_match:
              controller_assets = re.findall(r'"(app/[^"]+\.js)"', module_match.group(1))
          missing_lines = [f'  "./{module}",' for module in controller_assets if f'"./{module}"' not in sw]
          if missing_lines:
              anchor = '  "./app/bootstrap.js",'
              sw = sw.replace(anchor, anchor + '\n' + '\n'.join(missing_lines), 1)
          write('service-worker.js', sw)

          manifest_path = root / 'update-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update({
              'schemaVersion': 1,
              'version': version,
              'releaseUrl': production_url,
              'downloadUrl': production_url,
              'notes': (
                  'ServoForge 0.9.9 promotes the approved staging controller architecture, '
                  'startup loader, layout-oriented themes, semantic health visuals, Map Builder '
                  'lifecycle fixes, dimension-driven label presence, coder fallback, and final '
                  'TOPMODUL CMD 3/CMD 7 segment ownership.'
              )
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          notes_path = root / 'release-notes.json'
          notes = json.loads(notes_path.read_text(encoding='utf-8'))
          notes['environment'] = 'production'
          notes['currentVersion'] = version
          notes['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          release = {
              'version': version,
              'milestone': 13,
              'title': 'Controller Architecture and TOPMODUL Stabilization',
              'summary': 'Promotes the approved modular workspace, refined operator visuals, reliable Map Builder actions, and corrected TOPMODUL profile validation.',
              'changes': [
                  'Split workspace state, event handling, rendering, validation, map, specification, station, Servo Program, and simulation responsibilities into focused modules.',
                  'Add milestone-based startup progress and make Direct view the default for new workspaces.',
                  'Add Carbon Crimson, Carbon Brass, Graphite Copper, and Midnight Alloy themes with theme-independent green, yellow, and red health semantics.',
                  'Keep the Validation panel within its available width and simplify the Servo Pipeline status presentation.',
                  'Restore Map Builder add, delete, station delete, and double-click-to-edit behavior across runtime object sources.',
                  'Derive Neck, Body, and Back label presence from dimensions greater than 1 mm instead of manual section checkboxes.',
                  'Retarget coding to an active label when a saved Back target is unavailable while preserving physical sensor validation.',
                  'Assign TOPMODUL CMD 7 to actual plate-motion segments and CMD 3 only to true holds, eliminating stale Rest-with-motion failures.'
              ]
          }
          existing = [item for item in notes.get('releases', []) if item.get('version') != version]
          notes['releases'] = [release, *existing]
          notes_path.write_text(json.dumps(notes, indent=2) + '\n', encoding='utf-8')

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.js', '.json', '.html', '.webmanifest', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('https://bry4nt06.github.io/labeler-tool-staging/', production_url)
              updated = updated.replace('ServoForge Labeler — STAGING', 'ServoForge Labeler')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit normalized production release
        shell: bash
        run: |
          cd production
          rm -f .github/workflows/promote-servoforge-0.9.9.yml
          git config user.name "ServoForge Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Promote approved staging 200c8d2 as ServoForge 0.9.9"
          git push origin HEAD:release/servoforge-0.9.9-2026-08-03
