name: Promote Exact ServoForge 0.9.3 Staging Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-servoforge-0.9.1.yml

permissions:
  contents: write

concurrency:
  group: promote-servoforge-production
  cancel-in-progress: false

jobs:
  promote-exact-staging-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch approved staging build
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Bry4nt06/labeler-tool-staging.git /tmp/labeler-tool-staging
          git -C /tmp/labeler-tool-staging checkout c5e9b592756a2195b13629112b6c65050967bbb3

      - name: Replace production runtime with staging runtime
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/labeler-tool-staging/ ./

      - name: Normalize production identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/normalize_servoforge.py <<'PY'
          import datetime
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          version = "0.9.3"
          staging_commit = "c5e9b592756a2195b13629112b6c65050967bbb3"
          staging_url = "https://bry4nt06.github.io/labeler-tool-staging/"
          production_url = "https://bry4nt06.github.io/labeler-tool-app/"

          text_suffixes = {".html", ".js", ".json", ".css", ".md", ".yml", ".yaml", ".webmanifest", ".txt"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".github" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"CNAME", ".nojekyll"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              revised = text.replace(staging_url, production_url).replace("labeler-tool-staging", "labeler-tool-app")
              if revised != text:
                  path.write_text(revised, encoding="utf-8")

          staging_alignment = root / "app" / "release-readiness-staging-alignment-integration.js"
          if staging_alignment.exists():
              staging_alignment.unlink()

          for relative in [
              "app/simulation-collapsible-integration.js",
              "service-worker.js",
              "app/update-manager.js"
          ]:
              path = root / relative
              if not path.exists():
                  continue
              original = path.read_text(encoding="utf-8")
              trailing_newline = original.endswith("\n")
              lines = [
                  line for line in original.splitlines()
                  if "release-readiness-staging-alignment-integration.js" not in line
              ]
              revised = "\n".join(lines) + ("\n" if trailing_newline else "")
              path.write_text(revised, encoding="utf-8")

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r'<div class="staging-environment-banner"[^>]*>.*?</div>\s*', "", index, count=1, flags=re.I | re.S)
          index = index.replace("ServoForge Labeler — STAGING", "ServoForge Labeler")
          index = index.replace("STAGING / TEST BUILD — NOT PRODUCTION", "")
          index = re.sub(r'(<meta name="application-version" content=")[^"]+(" />)', rf'\g<1>{version}\2', index)
          index = re.sub(r'\?v=\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]*)?', f'?v={version}', index)
          index = re.sub(r'Version\s+\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]*)?\s+•\s+Updates are checked automatically\.', f'Version {version} • Updates are checked automatically.', index)
          index_path.write_text(index, encoding="utf-8")

          loader_path = root / "app" / "simulation-collapsible-integration.js"
          loader = loader_path.read_text(encoding="utf-8")
          loader = loader.replace("Staging integration load failed", "Production integration load failed")
          loader_path.write_text(loader, encoding="utf-8")

          updater_path = root / "app" / "update-manager.js"
          updater = updater_path.read_text(encoding="utf-8")
          updater = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', updater)
          updater = updater.replace("loadStagingFeatureModules", "loadProductionFeatureModules")
          updater = updater.replace("Staging feature module load failed", "Production feature module load failed")
          updater_path.write_text(updater, encoding="utf-8")

          worker_path = root / "service-worker.js"
          worker = worker_path.read_text(encoding="utf-8")
          worker = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', worker)
          worker = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-v{version}-production-{staging_commit[:7]}";', worker)
          worker = re.sub(r'const CACHE_PREFIX = "[^"]+";', 'const CACHE_PREFIX = "servoforge-labeler-";', worker)
          worker_path.write_text(worker, encoding="utf-8")

          manifest_path = root / "update-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "schemaVersion": 1,
              "version": version,
              "releaseUrl": production_url,
              "downloadUrl": production_url,
              "notes": f"ServoForge {version} production is an exact normalized copy of approved staging commit {staging_commit[:7]}."
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          notes_path = root / "release-notes.json"
          notes = json.loads(notes_path.read_text(encoding="utf-8"))
          notes["environment"] = "production"
          notes["currentVersion"] = version
          notes["generatedAt"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          release = {
              "version": version,
              "milestone": 13,
              "title": "Neck Pad Center-Tack Planning and Map Workflow Refinements",
              "summary": "Makes APL label-section ownership independent of wipe hardware and promotes the current map, specification, and two-label profile refinements.",
              "changes": [
                  "Treat Stations 1 and 2 as Neck stations even when wipe-down pads replace the original roller hardware.",
                  "Set the bottle to the Neck centerline for center-tack application before pad contact.",
                  "Use separate outside and inside wipe-down pad windows to wipe from the label center toward both edges.",
                  "Report a missing inside or outside Neck pad instead of simulating both wipe directions on one physical pad.",
                  "Add Duplicate controls for Bottle and Label specification rows.",
                  "Remove Zone and Site abbreviations from map prompts and runtime map organization.",
                  "Include the corrected no-Neck Body/Back Landshark application, wipe direction, and coder alignment sequence.",
                  "Preserve smooth map-object drill-down, selected-HMI replay, station authority, and current Cold Glue planning integrations."
              ]
          }
          existing = [entry for entry in notes.get("releases", []) if str(entry.get("version")) != version]
          notes["releases"] = [release, *existing]
          notes_path.write_text(json.dumps(notes, indent=2) + "\n", encoding="utf-8")
          PY

          python3 /tmp/normalize_servoforge.py .

      - name: Validate exact normalized parity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/normalized-staging
          mkdir -p /tmp/normalized-staging
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/labeler-tool-staging/ /tmp/normalized-staging/
          python3 /tmp/normalize_servoforge.py /tmp/normalized-staging

          diff_output="$(diff -qr --exclude=.git --exclude=.github /tmp/normalized-staging . || true)"
          if [ -n "$diff_output" ]; then
            echo "Production differs from the normalized approved staging build:"
            echo "$diff_output"
            exit 1
          fi

          grep -q 'content="0.9.3"' index.html
          grep -q 'Version 0.9.3' index.html
          grep -q 'bry4nt06.github.io/labeler-tool-app/' update-manifest.json
          grep -q 'apl-neck-pad-center-tack-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'spec-row-duplicate-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'remove-zone-site-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'apl-body-back-two-label-transition-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'apl-back-wipe-direction-correction-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'servo-replay-loop-controls-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'map-builder-station-authority-integration.js' app/simulation-collapsible-integration.js service-worker.js
          grep -q 'map-object-builder-selection-integration.js' app/simulation-collapsible-integration.js service-worker.js
          ! test -e app/release-readiness-staging-alignment-integration.js
          ! grep -R -n --exclude-dir=.git --exclude-dir=.github 'labeler-tool-staging\|STAGING / TEST BUILD' .

          find app drivers -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check service-worker.js
          python3 -m json.tool update-manifest.json >/dev/null
          python3 -m json.tool release-notes.json >/dev/null
          echo 'Exact normalized staging parity validated.'

      - name: Commit exact production build
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Production already matches the approved staging build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote ServoForge 0.9.3 from staging c5e9b59'
          git push origin HEAD:main
          git push origin HEAD:release/servoforge-0.9.3-2026-08-01

# Native merge trigger for the approved ServoForge 0.9.3 production promotion.
