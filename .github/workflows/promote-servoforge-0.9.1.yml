name: Promote Exact ServoForge Staging Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-servoforge-0.9.1.yml

permissions:
  contents: write

concurrency:
  group: promote-servoforge-production
  cancel-in-progress: false

jobs:
  promote-exact-staging-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch approved staging build
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Bry4nt06/labeler-tool-staging.git /tmp/labeler-tool-staging
          git -C /tmp/labeler-tool-staging checkout 7f08492700d14726d3d2a60f7cd846dba4566a2c

      - name: Replace production runtime
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/labeler-tool-staging/ ./

      - name: Normalize production identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/normalize_servoforge.py <<'PY'
          import datetime
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          version = "0.9.5"
          staging_commit = "7f08492700d14726d3d2a60f7cd846dba4566a2c"
          staging_url = "https://bry4nt06.github.io/labeler-tool-staging/"
          production_url = "https://bry4nt06.github.io/labeler-tool-app/"

          text_suffixes = {".html", ".js", ".json", ".css", ".md", ".yml", ".yaml", ".webmanifest", ".txt"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".github" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"CNAME", ".nojekyll"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              revised = text.replace(staging_url, production_url).replace("labeler-tool-staging", "labeler-tool-app")
              if revised != text:
                  path.write_text(revised, encoding="utf-8")

          staging_alignment = root / "app" / "release-readiness-staging-alignment-integration.js"
          if staging_alignment.exists():
              staging_alignment.unlink()

          for relative in [
              "app/simulation-collapsible-integration.js",
              "service-worker.js",
              "app/update-manager.js"
          ]:
              path = root / relative
              if not path.exists():
                  continue
              original = path.read_text(encoding="utf-8")
              trailing_newline = original.endswith("\n")
              lines = [line for line in original.splitlines()
                       if "release-readiness-staging-alignment-integration.js" not in line]
              path.write_text("\n".join(lines) + ("\n" if trailing_newline else ""), encoding="utf-8")

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r'<div class="staging-environment-banner"[^>]*>.*?</div>\s*', "", index, count=1, flags=re.I | re.S)
          index = index.replace("ServoForge Labeler — STAGING", "ServoForge Labeler")
          index = index.replace("STAGING / TEST BUILD — NOT PRODUCTION", "")
          index = re.sub(r'(<meta name="application-version" content=")[^"]+(" />)', rf'\g<1>{version}\2', index)
          index = re.sub(r'\?v=\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]*)?', f'?v={version}', index)
          index = re.sub(r'Version\s+\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]*)?\s+•\s+Updates are checked automatically\.', f'Version {version} • Updates are checked automatically.', index)
          index_path.write_text(index, encoding="utf-8")

          loader_path = root / "app" / "simulation-collapsible-integration.js"
          loader = loader_path.read_text(encoding="utf-8")
          loader = loader.replace("Staging integration load failed", "Production integration load failed")
          loader_path.write_text(loader, encoding="utf-8")

          updater_path = root / "app" / "update-manager.js"
          updater = updater_path.read_text(encoding="utf-8")
          updater = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', updater)
          updater = updater.replace("loadStagingFeatureModules", "loadProductionFeatureModules")
          updater = updater.replace("Staging feature module load failed", "Production feature module load failed")
          updater_path.write_text(updater, encoding="utf-8")

          worker_path = root / "service-worker.js"
          worker = worker_path.read_text(encoding="utf-8")
          worker = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', worker)
          worker = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-v{version}-production-7f08492";', worker)
          worker = re.sub(r'const CACHE_PREFIX = "[^"]+";', 'const CACHE_PREFIX = "servoforge-labeler-";', worker)
          worker_path.write_text(worker, encoding="utf-8")

          manifest_path = root / "update-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "schemaVersion": 1,
              "version": version,
              "releaseUrl": production_url,
              "downloadUrl": production_url,
              "notes": f"ServoForge {version} promotes the approved default-program package and exact normalized staging commit {staging_commit[:7]}."
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          notes_path = root / "release-notes.json"
          notes = json.loads(notes_path.read_text(encoding="utf-8"))
          notes["environment"] = "production"
          notes["currentVersion"] = version
          notes["generatedAt"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          notes_path.write_text(json.dumps(notes, indent=2) + "\n", encoding="utf-8")
          PY

          python3 /tmp/normalize_servoforge.py .

      - name: Validate normalized production build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'content="0.9.5"' index.html
          grep -q 'Version 0.9.5' index.html
          grep -q 'bry4nt06.github.io/labeler-tool-app/' update-manifest.json

          required=(
            app/company-default-programs-integration.js
            app/workbook-reference-map-library-integration.js
            app/locked-map-brand-selector-integration.js
            app/motion-profile-regeneration-integration.js
            app/apl-continuous-motion-integration.js
            app/map-object-coder-after-wipe-integration.js
            app/map-object-servo-orientation-integration.js
            app/apl-neck-final-pad-completion-integration.js
            app/map-object-double-click-open-fix-integration.js
            app/label-spec-section-selection-integration.js
          )
          for file in "${required[@]}"; do
            test -f "$file"
            name="$(basename "$file")"
            grep -q "$name" app/simulation-collapsible-integration.js service-worker.js
          done

          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path('.')
          manifest = json.loads((root / 'config/company-default-settings.json').read_text(encoding='utf-8'))
          assert manifest['companyDefaultsVersion'] == 2
          fragments = manifest['fragments']
          maps = [json.loads((root / path.removeprefix('./')).read_text(encoding='utf-8')) for path in fragments['mapLibrary']]
          labels = json.loads((root / fragments['labelSpecs'].removeprefix('./')).read_text(encoding='utf-8'))
          bottles = json.loads((root / fragments['bottleSpecs'].removeprefix('./')).read_text(encoding='utf-8'))
          assert len(maps) == 8
          assert len({item['id'] for item in maps}) == 8
          assert len(labels) == 16
          assert len(bottles) == 10
          reference = next(item for item in maps if item['id'] == 'map-l85-workbook-reference-3-label-apl')
          assert len(reference['objects']) == 15
          assert manifest['settings']['activeMapId'] == reference['id']
          PY

          ! test -e app/release-readiness-staging-alignment-integration.js
          ! grep -R -n --exclude-dir=.git --exclude-dir=.github 'labeler-tool-staging\|STAGING / TEST BUILD' .
          find app drivers -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check service-worker.js
          find config/default-programs -type f -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null
          python3 -m json.tool config/company-default-settings.json >/dev/null
          python3 -m json.tool update-manifest.json >/dev/null
          python3 -m json.tool release-notes.json >/dev/null

      - name: Commit and publish production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add -A
            git commit -m 'Promote approved staging 7f08492 to production 0.9.5'
          fi
          git push origin HEAD:main
          git push origin HEAD:release/servoforge-0.9.5-2026-08-01
