name: Promote Exact ServoForge Staging Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-servoforge-0.9.1.yml

permissions:
  contents: write

concurrency:
  group: promote-servoforge-production
  cancel-in-progress: false

jobs:
  promote-exact-staging-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch approved staging build
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Bry4nt06/labeler-tool-staging.git /tmp/labeler-tool-staging
          git -C /tmp/labeler-tool-staging checkout cc1d51e47ac7c5c76d6d18d876b947a3fbcea354

      - name: Replace production runtime with staging runtime
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/labeler-tool-staging/ ./

      - name: Normalize production identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/normalize_servoforge.py <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          version = "0.9.2"
          staging_url = "https://bry4nt06.github.io/labeler-tool-staging/"
          production_url = "https://bry4nt06.github.io/labeler-tool-app/"

          text_suffixes = {".html", ".js", ".json", ".css", ".md", ".yml", ".yaml", ".webmanifest", ".txt"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".github" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"CNAME", ".nojekyll"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              revised = text.replace(staging_url, production_url).replace("labeler-tool-staging", "labeler-tool-app")
              if revised != text:
                  path.write_text(revised, encoding="utf-8")

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r'<div class="staging-environment-banner"[^>]*>.*?</div>\s*', "", index, count=1, flags=re.I | re.S)
          index = index.replace("ServoForge Labeler — STAGING", "ServoForge Labeler")
          index = re.sub(r'(<meta name="application-version" content=")[^"]+(" />)', rf'\g<1>{version}\2', index)
          index = re.sub(r'\?v=\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]*)?', f'?v={version}', index)
          index = re.sub(r'Version\s+\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]*)?\s+•\s+Updates are checked automatically\.', f'Version {version} • Updates are checked automatically.', index)
          index_path.write_text(index, encoding="utf-8")

          updater_path = root / "app" / "update-manager.js"
          updater = updater_path.read_text(encoding="utf-8")
          updater = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', updater)
          updater = updater.replace("loadStagingFeatureModules", "loadProductionFeatureModules")
          updater = updater.replace("Staging feature module load failed", "Production feature module load failed")
          updater_path.write_text(updater, encoding="utf-8")

          worker_path = root / "service-worker.js"
          worker = worker_path.read_text(encoding="utf-8")
          worker = re.sub(r'const RELEASE_VERSION = "[^"]+";', f'const RELEASE_VERSION = "{version}";', worker)
          worker = re.sub(r'const CACHE_NAME = "[^"]+";', f'const CACHE_NAME = "servoforge-labeler-v{version}-exact-staging-cc1d51e";', worker)
          worker = re.sub(r'const CACHE_PREFIX = "[^"]+";', 'const CACHE_PREFIX = "servoforge-labeler-";', worker)
          worker_path.write_text(worker, encoding="utf-8")

          manifest_path = root / "update-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "schemaVersion": 1,
              "version": version,
              "releaseUrl": production_url,
              "downloadUrl": production_url,
              "notes": "ServoForge 0.9.2 production is an exact normalized copy of approved staging commit cc1d51e."
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          notes_path = root / "release-notes.json"
          notes = json.loads(notes_path.read_text(encoding="utf-8"))
          notes["environment"] = "production"
          notes["currentVersion"] = version
          notes["generatedAt"] = "2026-07-30T18:45:00Z"
          notes_path.write_text(json.dumps(notes, indent=2) + "\n", encoding="utf-8")
          PY

          python3 /tmp/normalize_servoforge.py .

      - name: Validate exact normalized parity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/normalized-staging
          mkdir -p /tmp/normalized-staging
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/labeler-tool-staging/ /tmp/normalized-staging/
          python3 /tmp/normalize_servoforge.py /tmp/normalized-staging

          diff_output="$(diff -qr --exclude=.git --exclude=.github /tmp/normalized-staging . || true)"
          if [ -n "$diff_output" ]; then
            echo "Production differs from the normalized approved staging build:"
            echo "$diff_output"
            exit 1
          fi

          grep -q 'content="0.9.2"' index.html
          grep -q 'Version 0.9.2' index.html
          grep -q 'bry4nt06.github.io/labeler-tool-app/' update-manifest.json
          ! grep -R -n --exclude-dir=.git --exclude-dir=.github 'labeler-tool-staging\|STAGING / TEST BUILD' .

          find app drivers -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check service-worker.js
          python3 -m json.tool update-manifest.json >/dev/null
          python3 -m json.tool release-notes.json >/dev/null
          echo 'Exact normalized staging parity validated.'

      - name: Commit exact production build
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Production already matches the approved staging build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize production exactly with approved staging build'
          git push origin HEAD:main
